plugins {
    id 'com.android.application'
}

android {
    namespace 'com.edgedetection'
    compileSdk 35
    ndkVersion '29.0.14033849'

    defaultConfig {
        applicationId "com.edgedetection"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                cppFlags "-frtti -fexceptions"
                abiFilters 'arm64-v8a', 'armeabi-v7a'
                arguments "-DANDROID_STL=c++_shared"
            }
        }
        
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'org.maplibre.gl:android-sdk:11.8.3'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    def camerax_version = "1.3.0"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"
    def filament_version = "1.71.5"
    implementation "com.google.android.filament:filament-android:$filament_version"
    implementation "com.google.android.filament:gltfio-android:$filament_version"
    implementation "com.google.android.filament:filament-utils-android:$filament_version"
    implementation project(':opencv')
    
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.github.alexeyvasilyev:rtsp-client-android:5.6.4'
    implementation 'com.google.guava:guava:32.0.1-android'
}

// Workaround for JDK image transform issue
configurations.all {
    resolutionStrategy {
        force 'com.android.tools.build:gradle:8.2.0'
    }
}

